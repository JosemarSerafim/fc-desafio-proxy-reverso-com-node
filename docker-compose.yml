services:
  db:
    image: mysql:5.7
    container_name: db
    restart: always
    tty: true
    volumes:
      - ./mysql-data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=node_db
    networks:
      - desafio-node-network

  nginx-node:
    build:
      context: ./nginx
    container_name:  nginx-node
    tty: true
    restart: always
    ports:
      - 8080:80
    networks:
      - desafio-node-network


  app:
    build: 
      context: .
    image: fc-node-desafio
    container_name: node-app
    restart: always
    entrypoint: dockerize -wait tcp://db:3306 -timeout 20s npm run dev
    tty: true
    depends_on:
      - db
    volumes:
      - ./:/app
    networks:
      - desafio-node-network
    ports:
      - "3000:3000"
networks:
  desafio-node-network:
    driver: bridge